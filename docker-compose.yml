# NEXA — local production-like stack.
#
#   docker compose up --build
#   open http://localhost:3000
#
# To enable local AI (free, no API key):
#   docker compose --profile ai up --build -d
#   docker compose exec ollama ollama pull llama3.2
#   AI_PROVIDER=ollama docker compose up -d app
#
# Copy .env.example values into your shell or a .env file next to this file.
# The defaults below are for local development only — change the password and
# add HTTPS before exposing this stack to the internet.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa_local_dev}
      POSTGRES_DB: nexa
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://nexa:${POSTGRES_PASSWORD:-nexa_local_dev}@db:5432/nexa?schema=public
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}

      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.openai.com/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - nexa_uploads:/app/storage/uploads

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - nexa_ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  nexa_pgdata:
  nexa_uploads:
  nexa_ollama:
